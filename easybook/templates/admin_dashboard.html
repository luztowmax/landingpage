<!DOCTYPE html>
<html>
<head><title>Admin Dashboard</title></head>
<body>
  <h2>Admin Panel</h2>
  <h3>All Users</h3>
  <ul>
    {% for user in users %}
      <li>{{ user.email }} - Joined {{ user.date_joined }}</li>
    {% endfor %}
  </ul>

  <h3>All Payments</h3>
  <ul>
    {% for pay in payments %}
      <li>{{ pay.user.email }} - ₦{{ pay.amount }} - {{ pay.ref }}</li>
    {% endfor %}
  </ul>
</body>
</html>
